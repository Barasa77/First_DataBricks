# Bundle vertice: a Torre de Controle da Vértice Tecnologia (Projeto Farol).
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vertice
  uuid: 243079eb-6a67-45fa-bb22-31b73d359984

include:
  - resources/*.yml

# O app minha-torre/ é um bundle próprio (com node_modules): fica fora do deploy do vertice.
# .claude/ e .databricks/aitools/ são as skills dos agentes, não vão para o workspace.
sync:
  exclude:
    - "minha-torre/**"
    - ".claude/**"
    - ".databricks/aitools/**"

variables:
  catalog:
    description: Catálogo do projeto (bronze, silver e gold)
    default: lakehouse_vertice
  warehouse_id:
    description: SQL warehouse das sql_task (Serverless Starter Warehouse)
    default: 9fc88b443d2620d4
  s3_access_key_id:
    description: chave do data lake (o valor fica fora do Git)
  s3_secret_access_key:
    description: chave do data lake (o valor fica fora do Git)

targets:
  dev:
    # Sem 'mode: development': ele prefixaria os nomes com '[dev usuario]'.
    # Os agendamentos ficam pausados pelo preset.
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-92be3050-442a.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-92be3050-442a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/daniel.barasini@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/daniel.barasini@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: daniel.barasini@gmail.com
        level: CAN_MANAGE
